AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Polling module start state
Resources:
  users:
    Type: AWS::Serverless::Application
    Properties:
      Location: users/template.yaml
    Metadata:
      SamResourceId: users
  orders:
    Type: AWS::Serverless::Application
    Properties:
      Location: orders/template.yaml
      Parameters:
        UserPool:
          Fn::GetAtt:
          - users
          - Outputs.UserPool
    Metadata:
      SamResourceId: orders
  userprofile:
    Type: AWS::Serverless::Application
    Properties:
      Location: userprofile/template.yaml
      Parameters:
        UserPool:
          Fn::GetAtt:
          - users
          - Outputs.UserPool
    Metadata:
      SamResourceId: userprofile
